name: Update Before You Read status

on:
  push:
    paths:
      - '.github/workflows/update-byr-status.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update landing copy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def update(path, replacements):
              s = path.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing expected copy in {path}: {old[:100]}')
                  s = s.replace(old, new)
              path.write_text(s)

          en = Path('before-you-read/index.html')
          pt = Path('before-you-read/pt-br/index.html')

          update(en, [
            ('Before You Read is a private MVP in development for Christian parents who want concise, passage-specific preparation before reading difficult Bible passages with children ages 4–9.', 'Before You Read is in final development after completing validation testing, with 30 validated passage-specific Parent Preps for Christian parents reading difficult Bible passages with children ages 4–9.'),
            ('Prepare the parent. Preserve the text. A private MVP in development and validation testing for difficult Bible passages families read together.', 'Prepare the parent. Preserve the text. Validation testing is complete, with 30 validated passages now in final development before paid release.'),
            ('aria-label="Private MVP interface preview"', 'aria-label="Product interface preview"'),
            ('<span>PRIVATE MVP INTERFACE</span>', '<span>DEVELOPMENT INTERFACE</span>'),
            ('<p class="kicker light">Small on purpose</p>\n          <h2 id="library-title">Five difficult passages.<br><em>Reviewed deeply before growing broadly.</em></h2>\n          <p>The private MVP begins with a deliberately small library so the method can be tested before the scope expands.</p>', '<p class="kicker light">Validated before release</p>\n          <h2 id="library-title">Thirty difficult passages.<br><em>Reviewed deeply before public release.</em></h2>\n          <p>The current library contains 30 validated, passage-specific Parent Preps. The passages below are five examples from the broader set now moving through final product development.</p>'),
            ('<h2 id="status-title">Private MVP.<br><em>Still being built and tested.</em></h2>\n          <p class="status-lede">Public product access is not open yet. The current stage is about learning whether the preparation is useful, understandable, trustworthy, and worth continuing to build.</p>', '<h2 id="status-title">Validation complete.<br><em>Final development underway.</em></h2>\n          <p class="status-lede">The testing phase is complete. Before You Read is now in final development: refining the product experience, preserving the editorial standard across 30 validated passages, and preparing for a paid public release.</p>'),
            ('<div><dt>Stage</dt><dd>In development + validation testing</dd></div>\n          <div><dt>Content</dt><dd>Five passage-specific Parent Preps</dd></div>\n          <div><dt>Audience</dt><dd>Parents/caregivers reading with ages 4–9</dd></div>\n          <div><dt>Languages</dt><dd>EN-US + PT-BR</dd></div>\n          <div><dt>Access</dt><dd>Private validation only</dd></div>', '<div><dt>Stage</dt><dd>Final development</dd></div>\n          <div><dt>Validation</dt><dd>Testing complete</dd></div>\n          <div><dt>Content</dt><dd>30 validated passage-specific Parent Preps</dd></div>\n          <div><dt>Audience</dt><dd>Parents/caregivers reading with ages 4–9</dd></div>\n          <div><dt>Languages</dt><dd>EN-US + PT-BR</dd></div>\n          <div><dt>Release</dt><dd>Preparing for paid public access</dd></div>'),
            ('<p class="kicker light">If the validation supports the job</p>\n        <div>\n          <h2 id="vision-title">Grow the library carefully.<br><em>Keep the method demanding.</em></h2>\n          <p>The next step is not to generate every passage. It is to learn whether this specific kind of preparation deserves to exist — then expand only with the same passage-first, source-aware, parent-facing standard.</p>', '<p class="kicker light">From validation to release</p>\n        <div>\n          <h2 id="vision-title">Grow carefully.<br><em>Keep the method demanding.</em></h2>\n          <p>Validation testing is complete. The work now is to finish the product experience, maintain the same passage-first, source-aware, parent-facing standard across the 30 validated passages, and prepare for a paid public release.</p>'),
            ('<span>Private MVP · 2026</span>', '<span>Final development · 2026</span>'),
            ('Private MVP · In development · Validation testing in progress', '30 passages validated · Testing complete · Final development'),
          ])

          update(pt, [
            ('Before You Read é um MVP privado em desenvolvimento para pais cristãos que querem uma preparação curta e específica antes de ler passagens bíblicas difíceis com crianças de 4 a 9 anos.', 'Before You Read está em desenvolvimento final após concluir os testes de validação, com 30 Parent Preps validados para pais cristãos que leem passagens bíblicas difíceis com crianças de 4 a 9 anos.'),
            ('Prepare o adulto. Preserve o texto bíblico. Um MVP privado em desenvolvimento e em teste de validação para passagens bíblicas difíceis lidas em família.', 'Prepare o adulto. Preserve o texto bíblico. Os testes de validação foram concluídos, com 30 passagens validadas agora em desenvolvimento final antes do lançamento pago.'),
            ('aria-label="Prévia da interface do MVP privado"', 'aria-label="Prévia da interface do produto"'),
            ('<span>INTERFACE DO MVP PRIVADO</span>', '<span>INTERFACE EM DESENVOLVIMENTO</span>'),
            ('<p class="kicker light">Pequeno de propósito</p>\n          <h2 id="library-title">Cinco passagens difíceis.<br><em>Revisadas em profundidade antes de crescer em volume.</em></h2>\n          <p>O MVP privado começa com uma biblioteca deliberadamente pequena para que o método seja testado antes de ampliar o escopo.</p>', '<p class="kicker light">Validado antes do lançamento</p>\n          <h2 id="library-title">Trinta passagens difíceis.<br><em>Revisadas em profundidade antes do lançamento público.</em></h2>\n          <p>A biblioteca atual reúne 30 Parent Preps validados e específicos por passagem. As passagens abaixo são cinco exemplos do conjunto mais amplo que agora segue para a etapa final de desenvolvimento do produto.</p>'),
            ('<h2 id="status-title">MVP privado.<br><em>Ainda em construção e teste.</em></h2>\n          <p class="status-lede">O acesso público ao produto ainda não está aberto. A fase atual existe para aprender se essa preparação é útil, compreensível, confiável e se vale a pena continuar construindo.</p>', '<h2 id="status-title">Validação concluída.<br><em>Desenvolvimento final em andamento.</em></h2>\n          <p class="status-lede">A fase de testes foi concluída. Before You Read está agora em desenvolvimento final: refinando a experiência do produto, preservando o padrão editorial nas 30 passagens validadas e preparando o lançamento público pago.</p>'),
            ('<div><dt>Etapa</dt><dd>Em desenvolvimento + teste de validação</dd></div>\n          <div><dt>Conteúdo</dt><dd>Cinco Parent Preps específicos por passagem</dd></div>\n          <div><dt>Público</dt><dd>Pais/responsáveis lendo com crianças de 4–9 anos</dd></div>\n          <div><dt>Idiomas</dt><dd>EN-US + PT-BR</dd></div>\n          <div><dt>Acesso</dt><dd>Somente validação privada</dd></div>', '<div><dt>Etapa</dt><dd>Desenvolvimento final</dd></div>\n          <div><dt>Validação</dt><dd>Testes concluídos</dd></div>\n          <div><dt>Conteúdo</dt><dd>30 Parent Preps validados e específicos por passagem</dd></div>\n          <div><dt>Público</dt><dd>Pais/responsáveis lendo com crianças de 4–9 anos</dd></div>\n          <div><dt>Idiomas</dt><dd>EN-US + PT-BR</dd></div>\n          <div><dt>Lançamento</dt><dd>Preparação para acesso público pago</dd></div>'),
            ('<p class="kicker light">Se a validação sustentar o problema</p>\n        <div>\n          <h2 id="vision-title">Ampliar a biblioteca com cuidado.<br><em>Manter o método exigente.</em></h2>\n          <p>O próximo passo não é gerar todas as passagens. É descobrir se esse tipo específico de preparação merece existir — e então ampliar apenas mantendo o mesmo padrão: passagem em primeiro lugar, fontes, orientação ao adulto e responsabilidade editorial.</p>', '<p class="kicker light">Da validação ao lançamento</p>\n        <div>\n          <h2 id="vision-title">Ampliar com cuidado.<br><em>Manter o método exigente.</em></h2>\n          <p>Os testes de validação foram concluídos. O trabalho agora é finalizar a experiência do produto, manter o mesmo padrão — passagem em primeiro lugar, fontes, orientação ao adulto e responsabilidade editorial — nas 30 passagens validadas e preparar o lançamento público pago.</p>'),
            ('<span>MVP privado · 2026</span>', '<span>Desenvolvimento final · 2026</span>'),
            ('MVP privado · Em desenvolvimento · Em teste de validação', '30 passagens validadas · Testes concluídos · Desenvolvimento final'),
          ])
          PY

      - name: Update social image
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          p = Path('before-you-read/assets/og.png')
          im = Image.open(p).convert('RGB')
          d = ImageDraw.Draw(im)
          bg = im.getpixel((20, 20))
          d.rectangle([80, 400, 1130, 465], fill=bg)
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 22)
          d.text((89, 417), '30 passages validated · Testing complete · Final development', fill=(111, 121, 113), font=font)
          im.save(p, optimize=True)
          PY

      - name: Verify and commit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          en = Path('before-you-read/index.html').read_text()
          pt = Path('before-you-read/pt-br/index.html').read_text()
          required = [
            (en, '30 passages validated'),
            (en, 'Testing complete'),
            (en, 'Thirty difficult passages'),
            (pt, '30 passagens validadas'),
            (pt, 'Testes concluídos'),
            (pt, 'Trinta passagens difíceis'),
          ]
          forbidden = [
            (en, 'Validation testing in progress'),
            (en, 'Five difficult passages'),
            (en, 'Private validation only'),
            (pt, 'Em teste de validação'),
            (pt, 'Cinco passagens difíceis'),
            (pt, 'Somente validação privada'),
          ]
          for text, needle in required:
              assert needle in text, needle
          for text, needle in forbidden:
              assert needle not in text, needle
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add before-you-read/index.html before-you-read/pt-br/index.html before-you-read/assets/og.png
          git diff --cached --quiet || git commit -m 'chore: update Before You Read launch status'
          git push origin main
